name: Dependency Updates

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    # A green run takes 5-7 minutes, up to 15 when the Python or browser install is slow.
    # Fail a stuck run instead of letting it block merges.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Python dependencies
        run: cd packages/python && poetry install --with test

      - name: Run Python unit tests
        run: cd packages/python && poetry run pytest tests/ -v

      - name: Run JS unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # The suite takes about a minute; 9 tests that each wait for their full time-out take over 30.
        timeout-minutes: 10
        run: pnpm test:e2e

      - name: Build
        run: pnpm run build
